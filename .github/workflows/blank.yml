name: Evaluacion Automatica

on: [push]

jobs:
  run-tests:
    runs-on: ubuntu-latest

    steps:
    - name: Copiar codigo del estudiante
      uses: actions/checkout@v4

    - name: Descargar tests ocultos del profesor
      uses: actions/checkout@v4
      with:
        repository: 'jolgo1989/algoritmos-tests-privados'
        token: ${{ secrets.PROFESOR_TOKEN }}
        path: 'tests_ocultos'

    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Instalar pytest
      run: |
        python -m pip install --upgrade pip
        pip install pytest

    - name: Ejecutar pruebas
      run: |
        pytest tests/ tests_ocultos/ -v
